spring.application.name=gillnet-ai
server.port=${PORT:8081}

# MongoDB Configuration
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/gillnet_db?serverSelectionTimeoutMS=2000&connectTimeoutMS=2000}
spring.data.mongodb.auto-index-creation=true

# Python ML Service Configuration
ml.service.url=${ML_SERVICE_URL:http://localhost:5000}

# JWT Secret
app.jwt.secret=${JWT_SECRET:gillnet-ai-super-secret-security-key-2026-spring-boot-cybersecurity}
app.jwt.expiration-ms=86400000

# Logging
logging.level.com.gillnet=INFO
logging.level.org.springframework.security=WARN
