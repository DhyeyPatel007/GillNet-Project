spring.application.name=gillnet-ai
server.port=${PORT:8081}

# File upload (Autopsy tab) — Spring Boot defaults to 1 MB, raise for forensic files
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# MongoDB Configuration (Spring Boot 4 uses the spring.mongodb.* prefix;
# spring.data.mongodb.* connection properties are no longer bound)
spring.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/gillnet_db?serverSelectionTimeoutMS=2000&connectTimeoutMS=2000}
spring.data.mongodb.auto-index-creation=false

# Python ML Service Configuration
ml.service.url=${ML_SERVICE_URL:http://localhost:5000}

# JWT Secret
# JWT Secret — set JWT_SECRET env var in production. When unset, the app
# generates a random secret at startup (sessions don't survive restarts).
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=86400000

# Logging
logging.level.com.gillnet=INFO
logging.level.org.springframework.security=WARN

# Google OAuth — GOOGLE_CLIENT_ID env var overrides the built-in default.
# A Google OAuth client ID is a public identifier (it's embedded in the
# frontend sign-in button by design), so shipping it as a default is safe.
# Google logins are REJECTED if this ends up empty (fail closed).
google.client.id=${GOOGLE_CLIENT_ID:282362758732-lan9p372fivlpm14pd4qcaintcffgumn.apps.googleusercontent.com}

# Credits — free credits granted to every new account. Override with SIGNUP_CREDITS env var.
app.credits.signup-bonus=${SIGNUP_CREDITS:100}
# Daily grant — bonus credits added to an active user's balance once per UTC day. Override with DAILY_CREDITS env var.
app.credits.daily-grant=${DAILY_CREDITS:50}
