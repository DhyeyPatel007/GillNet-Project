spring.application.name=gillnet-ai
server.port=${PORT:8081}

# MongoDB Configuration
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/gillnet_db?serverSelectionTimeoutMS=2000&connectTimeoutMS=2000}
spring.data.mongodb.auto-index-creation=false

# Python ML Service Configuration
ml.service.url=${ML_SERVICE_URL:http://localhost:5000}

# JWT Secret
# JWT Secret — set JWT_SECRET env var in production. When unset, the app
# generates a random secret at startup (sessions don't survive restarts).
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=86400000

# Logging
logging.level.com.gillnet=INFO
logging.level.org.springframework.security=WARN

# Google OAuth — set GOOGLE_CLIENT_ID env var to your Google Cloud OAuth client ID.
# Google logins are REJECTED until this is configured (fail closed).
google.client.id=${GOOGLE_CLIENT_ID:}

# Credits — free credits granted to every new account. Override with SIGNUP_CREDITS env var.
app.credits.signup-bonus=${SIGNUP_CREDITS:100}
